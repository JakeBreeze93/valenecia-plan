<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valencia 2026</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, system-ui, sans-serif;
  background: #0f0f0f;
  color: #e0e0e0;
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
}
header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(15,15,15,0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 16px 20px;
  border-bottom: 1px solid #2a2a2a;
}
header h1 { font-size: 20px; font-weight: 700; color: #fff; }
header .meta { display: flex; gap: 12px; margin-top: 4px; font-size: 13px; color: #888; }
header .meta span { white-space: nowrap; }

.hero {
  padding: 20px;
}
.hero-card {
  background: #1a1a1a;
  border-radius: 16px;
  padding: 24px;
  border-left: 4px solid #444;
  position: relative;
}
.hero-card.tempo { border-left-color: #ffd93d; }
.hero-card.easy { border-left-color: #4caf50; }
.hero-card.vo2 { border-left-color: #c44dff; }
.hero-card.long { border-left-color: #4ecdc4; }
.hero-card.race { border-left-color: #ff6b6b; }
.hero-card.rest { border-left-color: #444; }
.hero-card.cross { border-left-color: rgba(255,217,61,0.85); }
.hero-date { font-size: 13px; color: #888; margin-bottom: 8px; }
.hero-name { font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 8px; }
.hero-detail { font-size: 14px; color: #bbb; line-height: 1.5; }
.hero-badges { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
}
.badge-distance { background: rgba(78,205,196,0.15); color: #4ecdc4; }
.badge-track { background: rgba(196,77,255,0.15); color: #c44dff; }
.hero-prestart { text-align: center; padding: 40px 20px; color: #888; font-size: 15px; }

.week-tabs {
  padding: 0 20px;
  margin-bottom: 20px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.week-tabs::-webkit-scrollbar { display: none; }
.week-tabs-inner {
  display: flex;
  gap: 8px;
  padding: 4px 0;
}
.week-tab {
  min-width: 44px; min-height: 44px;
  display: flex; align-items: center; justify-content: center;
  padding: 8px 14px;
  border-radius: 22px;
  font-size: 13px;
  font-weight: 600;
  background: #1a1a1a;
  color: #888;
  border: 1px solid #2a2a2a;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.3s ease;
  flex-shrink: 0;
}
.week-tab.active {
  background: #4ecdc4;
  color: #000;
  border-color: #4ecdc4;
}

.week-sessions { padding: 0 20px 20px; }
.session-card {
  background: #1a1a1a;
  border-radius: 12px;
  margin-bottom: 8px;
  border-left: 3px solid #444;
  overflow: hidden;
  transition: all 0.3s ease;
}
.session-card.tempo { border-left-color: #ffd93d; }
.session-card.easy { border-left-color: #4caf50; }
.session-card.vo2 { border-left-color: #c44dff; }
.session-card.long { border-left-color: #4ecdc4; }
.session-card.race { border-left-color: #ff6b6b; }
.session-card.rest { border-left-color: #444; }
.session-card.cross { border-left-color: rgba(255,217,61,0.85); }
.session-card.done { opacity: 0.5; }
.session-card.done .session-name { text-decoration: line-through; }
.session-header {
  display: flex;
  align-items: center;
  padding: 14px 16px;
  min-height: 44px;
  cursor: pointer;
  gap: 12px;
}
.session-day {
  font-size: 12px;
  font-weight: 600;
  color: #888;
  min-width: 32px;
}
.session-name {
  flex: 1;
  font-size: 14px;
  font-weight: 500;
  color: #e0e0e0;
}
.session-dist {
  font-size: 12px;
  color: #4ecdc4;
  font-weight: 600;
}
.session-expand {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
}
.session-card.expanded .session-expand {
  max-height: 200px;
}
.session-detail {
  padding: 0 16px 14px;
  font-size: 13px;
  color: #999;
  line-height: 1.5;
}
.done-btn {
  display: inline-block;
  margin-top: 10px;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  background: rgba(78,205,196,0.1);
  color: #4ecdc4;
  border: 1px solid rgba(78,205,196,0.3);
  cursor: pointer;
  min-height: 44px;
  min-width: 44px;
  transition: all 0.3s ease;
}
.session-card.done .done-btn {
  background: rgba(255,255,255,0.05);
  color: #666;
  border-color: #333;
}
.session-card.today .session-header {
  background: rgba(78,205,196,0.05);
}

.volume-chart {
  padding: 20px;
  border-top: 1px solid #2a2a2a;
  margin-top: 10px;
}
.volume-title {
  font-size: 14px;
  font-weight: 600;
  color: #888;
  margin-bottom: 14px;
}
.volume-bar-row {
  display: flex;
  align-items: center;
  margin-bottom: 6px;
  gap: 8px;
}
.volume-label {
  font-size: 11px;
  color: #666;
  min-width: 26px;
}
.volume-bar-bg {
  flex: 1;
  height: 18px;
  background: #1a1a1a;
  border-radius: 9px;
  overflow: hidden;
}
.volume-bar {
  height: 100%;
  border-radius: 9px;
  background: #333;
  transition: width 0.5s ease;
}
.volume-bar.active { background: #4ecdc4; }
.volume-val {
  font-size: 11px;
  color: #666;
  min-width: 28px;
  text-align: right;
}
</style>
</head>
<body>

      {day:'Wed',type:'cross',name:'Weights + Pilates',detail:'Moderate. Reformer Pilates.'},

      {day:'Fri',type:'rest',name:'Rest',detail:'Full rest. Hydrate.'},
      {day:'Sat',type:'easy',name:'Pre-Race Shakeout',detail:'3km very easy + 4×100m strides',distance:'3.5km'},
      {day:'Sun',type:'race',name:'RACE DAY',detail:'Valencia Marathon — Sub 2:50. Race pace: 4:01/km.',distance:'42.2km'}
    ]}
  ]

function getState() {
  const today = new Date();
  today.setHours(0,0,0,0);
  const start = new Date(plan.startDate + 'T00:00:00');
  const race = new Date(plan.raceDate + 'T00:00:00');
  const diffToRace = Math.ceil((race - today) / 86400000);
  const diffFromStart = Math.floor((today - start) / 86400000);
  let currentWeek = -1;
  let dayIndex = -1;
  if (diffFromStart >= 0 && diffFromStart < 84) {
    currentWeek = Math.floor(diffFromStart / 7) + 1;
    dayIndex = diffFromStart % 7;
  } else if (diffFromStart >= 84) {
    currentWeek = 13; // past race
  }
  return { today, diffToRace, currentWeek, dayIndex };
}

let selectedWeek = null;
let expandedCard = null;

function isDone(week, dayIdx) {
  return localStorage.getItem('valencia_done_' + week + '_' + dayIdx) === '1';
}
function toggleDone(week, dayIdx) {
  const key = 'valencia_done_' + week + '_' + dayIdx;
  if (localStorage.getItem(key) === '1') {
    localStorage.removeItem(key);
  } else {
    localStorage.setItem(key, '1');
  }
  render();
}

function render() {
  const state = getState();
  if (selectedWeek === null) {
    selectedWeek = state.currentWeek >= 1 && state.currentWeek <= 12 ? state.currentWeek : 1;
  }
  const weekData = plan.weeks[selectedWeek - 1];
  const app = document.getElementById('app');

  // Header
  let countdownText = '';
  if (state.diffToRace > 0) countdownText = state.diffToRace + ' days to go';
  else if (state.diffToRace === 0) countdownText = 'Race day!';
  else countdownText = 'Race complete';

  let weekText = '';
  if (state.currentWeek >= 1 && state.currentWeek <= 12) {
    weekText = 'Week ' + state.currentWeek + ' \u2022 ' + plan.weeks[state.currentWeek - 1].phase;
  } else if (state.currentWeek === 13) {
    weekText = 'Training complete';
  } else {
    weekText = 'Starts Sep 14';
  }

  // Hero
  let heroHTML = '';
  if (state.currentWeek >= 1 && state.currentWeek <= 12) {
    const todaySession = plan.weeks[state.currentWeek - 1].days[state.dayIndex];
    const dateStr = state.today.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
    heroHTML = '<div class="hero-card ' + todaySession.type + '">' +
      '<div class="hero-date">' + dateStr + '</div>' +
      '<div class="hero-name">' + todaySession.name + '</div>' +
      '<div class="hero-detail">' + todaySession.detail + '</div>' +
      '<div class="hero-badges">' +
      (todaySession.distance ? '<span class="badge badge-distance">' + todaySession.distance + '</span>' : '') +
      (todaySession.track ? '<span class="badge badge-track">Track</span>' : '') +
      '</div></div>';
  } else if (state.currentWeek === 13) {
    heroHTML = '<div class="hero-prestart">Race complete. Well done! 🏅</div>';
  } else {
    heroHTML = '<div class="hero-prestart">Training starts Sep 14, 2026</div>';
  }

  // Week tabs
  let tabsHTML = '';
  for (let i = 1; i <= 12; i++) {
    const active = i === selectedWeek ? ' active' : '';
    tabsHTML += '<div class="week-tab' + active + '" data-week="' + i + '">W' + i + '</div>';
  }

  // Sessions
  let sessionsHTML = '';
  weekData.days.forEach(function(session, idx) {
    const done = isDone(selectedWeek, idx);
    const expanded = expandedCard === selectedWeek + '_' + idx;
    const isToday = (selectedWeek === state.currentWeek && idx === state.dayIndex);
    let cls = 'session-card ' + session.type;
    if (done) cls += ' done';
    if (expanded) cls += ' expanded';
    if (isToday) cls += ' today';
    sessionsHTML += '<div class="' + cls + '" data-week="' + selectedWeek + '" data-idx="' + idx + '">' +
      '<div class="session-header">' +
      '<span class="session-day">' + session.day + '</span>' +
      '<span class="session-name">' + session.name + '</span>' +
      (session.distance ? '<span class="session-dist">' + session.distance + '</span>' : '') +
      '</div>' +
      '<div class="session-expand"><div class="session-detail">' +
      session.detail +
      '<br><span class="done-btn" data-week="' + selectedWeek + '" data-idx="' + idx + '">' +
      (done ? 'Undo' : '✓ Done') + '</span>' +
      '</div></div></div>';
  });

  // Volume chart
  const volumes = plan.weeks.map(function(w) { return w.volume; });
  const maxVol = Math.max.apply(null, volumes);
  let chartHTML = '';
  volumes.forEach(function(v, i) {
    const pct = (v / maxVol * 100).toFixed(1);
    const active = (i + 1) === selectedWeek ? ' active' : '';
    chartHTML += '<div class="volume-bar-row">' +
      '<span class="volume-label">W' + (i + 1) + '</span>' +
      '<div class="volume-bar-bg"><div class="volume-bar' + active + '" style="width:' + pct + '%"></div></div>' +
      '<span class="volume-val">' + v + '</span></div>';
  });

  app.innerHTML =
    '<header><h1>Valencia 2026</h1><div class="meta"><span>' + countdownText + '</span><span>' + weekText + '</span></div></header>' +
    '<section class="hero">' + heroHTML + '</section>' +
    '<nav class="week-tabs"><div class="week-tabs-inner">' + tabsHTML + '</div></nav>' +
    '<section class="week-sessions">' + sessionsHTML + '</section>' +
    '<section class="volume-chart"><div class="volume-title">Volume Progression</div>' + chartHTML + '</section>';

  // Event listeners
  document.querySelectorAll('.week-tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      selectedWeek = parseInt(this.dataset.week);
      expandedCard = null;
      render();
    });
  });
  document.querySelectorAll('.session-header').forEach(function(hdr) {
    hdr.addEventListener('click', function() {
      const card = this.parentElement;
      const key = card.dataset.week + '_' + card.dataset.idx;
      expandedCard = expandedCard === key ? null : key;
      render();
    });
  });
  document.querySelectorAll('.done-btn').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      toggleDone(parseInt(this.dataset.week), parseInt(this.dataset.idx));
    });
  });

  // Scroll active tab into view
  const activeTab = document.querySelector('.week-tab.active');
  if (activeTab) activeTab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}

render();
</script>
